name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate template configuration
        run: |
          python3 -m json.tool .claude/settings.json >/dev/null
          python3 -m json.tool .mcp.json >/dev/null
          not_exec=$(git ls-files --stage .claude/hooks .githooks | awk '$1 != "100755" {print $4}')
          if [ -n "$not_exec" ]; then
            echo "::error::Hook scripts are not executable in the git index:"
            echo "$not_exec"
            echo "Fix: git update-index --chmod=+x $(echo "$not_exec" | tr '\n' ' ')"
            exit 1
          fi
          echo "Template configuration is valid. Add stack-specific checks below."
