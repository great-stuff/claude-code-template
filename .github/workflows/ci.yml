name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate template configuration
        run: |
          python3 -m json.tool .claude/settings.json >/dev/null
          python3 -m json.tool .mcp.json >/dev/null
          test "$(git ls-files --stage .claude/hooks/pre-tool-use.sh | cut -c1-6)" = "100755"
          for hook in .githooks/post-checkout .githooks/post-commit .githooks/post-merge .githooks/pre-push; do
            test "$(git ls-files --stage "$hook" | cut -c1-6)" = "100755"
          done
          echo "Template configuration is valid. Add stack-specific checks below."
